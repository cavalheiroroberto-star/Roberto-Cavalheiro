<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Agro Forte, Futuro Sustentável</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌾 Agro Forte, Futuro Sustentável</h1>
            <p>Equilíbrio entre Produção e Meio Ambiente</p>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div id="quizContainer"></div>
        <div id="resultContainer" class="hidden result-container"></div>

        <div class="button-group" id="buttonGroup">
            <button class="btn-next" id="nextBtn" onclick="nextQuestion()">Próxima</button>
            <button class="btn-reset" id="resetBtn" onclick="resetQuiz()">Reiniciar</button>
        </div>
    </div>

    <script src="../js/script.js"></script>
</body>
</html>
